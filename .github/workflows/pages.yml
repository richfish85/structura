name: Deploy Structura to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "CURRENT_MILESTONE.md"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build validated reference
        run: python -m structura build

      - name: Stage public artifact
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          current = json.loads((root / "data/current.json").read_text(encoding="utf-8"))
          source = (root / current["snapshot"] / "site").resolve()
          builds = (root / "data/builds").resolve()
          if not source.is_relative_to(builds) or not (source / "index.html").is_file():
              raise SystemExit("Current snapshot does not contain a valid site")
          destination = root / "_site"
          shutil.copytree(source, destination)
          (destination / ".nojekyll").touch()
          forbidden = [path for path in destination.rglob("*") if path.suffix.lower() in {".db", ".sqlite", ".pdf", ".png"}]
          if forbidden:
              raise SystemExit("Forbidden public artifacts: " + ", ".join(str(path) for path in forbidden))

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
